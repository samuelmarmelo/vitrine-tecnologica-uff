<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conteúdo institucional — Privacidade, Termos e Acessibilidade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; background: #ffffff; color: #18181b; font-family: 'Nunito Sans', system-ui, sans-serif; line-height: 1.55; text-wrap: pretty">
<div style="max-width: {{v.maxW}}; margin: 0 auto; padding: {{v.pad}}; box-sizing: border-box; display: flex; flex-direction: column; gap: {{v.gapTopo}}">

<nav aria-label="Você está em" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5f5f68"><a href="{{v.inicio}}" style="display: flex; align-items: center; min-height: 32px; font-weight: 700; color: #004f9f; text-decoration: none">Início</a><span aria-hidden="true">/</span><span aria-current="page">{{pg.curto}}</span></nav>

<header style="display: flex; flex-direction: column; gap: 12px; max-width: 820px">
<span style="font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #004f9f">{{pg.eyebrow}}</span>
<h1 style="margin: 0; font-size: {{v.h1}}; font-weight: 800; line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance">{{pg.titulo}}</h1>
<p style="margin: 0; font-size: {{v.lead}}; color: #3f3f46">{{pg.intro}}</p>
<span style="font-size: 14px; color: #5f5f68">Atualizada em {{pg.atualizado}}</span>
</header>

<div style="display: grid; grid-template-columns: {{v.cols}}; gap: {{v.gapCols}}; align-items: start">
<nav aria-labelledby="{{pg.sumId}}" style="position: {{v.sumPos}}; top: 24px; padding: 18px 20px; border-radius: 16px; background: #f6f6f7; border: 1px solid #ececef; display: flex; flex-direction: column; gap: 4px">
<h2 id="{{pg.sumId}}" style="margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #5f5f68">Nesta página</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<sc-for list="{{secoes}}" as="s" hint-placeholder-count="6"><li><a href="{{s.ancora}}" style="display: flex; align-items: center; min-height: 36px; font-size: 15px; font-weight: 700; color: #004f9f; text-decoration: none; line-height: 1.3">{{s.rot}}</a></li></sc-for>
</ol>
</nav>

<div style="display: flex; flex-direction: column; gap: 36px; min-width: 0; max-width: 760px">
<sc-for list="{{secoes}}" as="s" hint-placeholder-count="6">
<section id="{{s.id}}" aria-labelledby="{{s.hid}}" style="display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 24px">
<h2 id="{{s.hid}}" style="margin: 0; font-size: {{s.h2}}; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; text-wrap: balance">{{s.rot}}</h2>
<sc-for list="{{s.ps}}" as="p" hint-placeholder-count="1"><p style="margin: 0; font-size: {{p.fs}}; color: #3f3f46">{{p.t}}</p></sc-for>
<sc-if value="{{s.temItens}}" hint-placeholder-val="{{false}}"><ul style="margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 6px; color: #3f3f46"><sc-for list="{{s.itens}}" as="i" hint-placeholder-count="3"><li style="font-size: {{i.fs}}">{{i.t}}</li></sc-for></ul></sc-if>
<sc-for list="{{s.ps2}}" as="p" hint-placeholder-count="0"><p style="margin: 0; font-size: {{p.fs}}; color: #3f3f46">{{p.t}}</p></sc-for>
</section>
</sc-for>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 16px; background: #f2f6fb; border: 1px solid #d6e2f0">
<b style="font-size: 17px; font-weight: 800">Ficou alguma dúvida?</b>
<span style="font-size: 15px; color: #3f3f46">Fale com a AGIR pelo e-mail <a href="mailto:agir.proppi@id.uff.br" style="color: #004f9f; font-weight: 800">agir.proppi@id.uff.br</a></span>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pagina":{"editor":null},"layout":{"editor":null},"$preview":{"width":1440,"height":1700}}'>
var HOJE = '17/11/2026';
var PAGS = {
  privacidade: {
    curto: 'Privacidade', eyebrow: 'Privacidade e LGPD', titulo: 'Política de privacidade',
    intro: 'Como a Vitrine Tecnológica da UFF trata os dados pessoais de quem visita o site ou manifesta interesse em uma tecnologia, conforme a Lei Geral de Proteção de Dados (Lei nº 13.709/2018).',
    secoes: [
      { t: 'Quem é responsável pelos dados', ps: ['A controladora é a Universidade Federal Fluminense (UFF). A gestão da vitrine e o atendimento aos interessados ficam com a AGIR, Agência de Inovação da UFF, ligada à PROPPI.'] },
      { t: 'Quais dados coletamos', ps: ['Só coletamos dados pessoais quando você preenche o formulário de manifestação de interesse:'], itens: ['Nome completo e e-mail', 'Telefone ou WhatsApp, se você informar', 'Empresa ou instituição e perfil (empresa, startup, pesquisador etc.)', 'Tecnologia de interesse, tipo de parceria e a mensagem enviada'], ps2: ['Durante a navegação, o servidor registra dados técnicos, como endereço IP, data, hora e páginas acessadas, para manter o site seguro.'] },
      { t: 'Para que usamos', ps: ['Usamos os dados para:'], itens: ['Responder ao seu contato e dar andamento à negociação', 'Apresentar seu interesse à equipe inventora, quando houver encaixe', 'Gerar estatísticas internas, sem identificar pessoas', 'Cumprir obrigações legais e de transparência da UFF'], ps2: ['Não usamos seus dados para publicidade e não os vendemos.'] },
      { t: 'Base legal', ps: ['O tratamento se apoia no seu consentimento, dado no formulário (art. 7º, I, da LGPD), e na execução de políticas públicas de inovação previstas na Lei nº 10.973/2004 (art. 7º, III, da LGPD). Você pode retirar o consentimento quando quiser.'] },
      { t: 'Com quem compartilhamos', ps: ['Seus dados ficam com a AGIR. Eles só são repassados à equipe inventora da tecnologia escolhida, e apenas o necessário para a conversa. Também podem ser informados a órgãos de controle, quando a lei exigir.'] },
      { t: 'Por quanto tempo guardamos', ps: ['Mantemos os dados enquanto durar a negociação e por [PRAZO A DEFINIR PELA AGIR] depois do encerramento, salvo obrigação legal de guarda por mais tempo. Depois disso, eles são apagados ou anonimizados.'] },
      { t: 'Cookies', ps: ['Usamos apenas os cookies necessários para o site funcionar. Os detalhes estão na Política de cookies.'] },
      { t: 'Seus direitos', ps: ['Pela LGPD (art. 18), você pode pedir a qualquer momento:'], itens: ['Confirmação de que tratamos seus dados e acesso a eles', 'Correção de dados incompletos ou desatualizados', 'Anonimização, bloqueio ou eliminação de dados desnecessários', 'Informação sobre com quem compartilhamos seus dados', 'Revogação do consentimento'] },
      { t: 'Segurança', ps: ['O site usa conexão criptografada (HTTPS), acesso restrito aos dados e registro de quem os consulta. Em caso de incidente relevante, avisaremos os titulares e a ANPD, como determina a lei.'] },
      { t: 'Contato do encarregado', ps: ['Para exercer seus direitos ou tirar dúvidas sobre dados pessoais, fale com o encarregado de dados da UFF: [NOME E E-MAIL DO ENCARREGADO]. Para assuntos da vitrine, escreva para agir.proppi@id.uff.br.'] }
    ]
  },
  termos: {
    curto: 'Termos de uso', eyebrow: 'Termos de uso', titulo: 'Termos de uso da Vitrine Tecnológica',
    intro: 'Regras para usar este site. Ao navegar ou manifestar interesse em uma tecnologia, você concorda com estes termos.',
    secoes: [
      { t: 'O que é a vitrine', ps: ['A Vitrine Tecnológica da UFF divulga patentes e programas de computador de titularidade da UFF disponíveis para licenciamento, transferência ou parceria. O site é informativo e não vende tecnologias.'] },
      { t: 'Informações publicadas', ps: ['Os dados de registro vêm das bases públicas do INPI e são atualizados pela AGIR. Os textos em linguagem simples são resumos de apoio, feitos com auxílio de inteligência artificial, e podem conter imprecisões.'], ps2: ['Em caso de divergência, vale sempre o documento oficial do INPI.'] },
      { t: 'Manifestação de interesse', ps: ['Enviar o formulário não cria obrigação para você nem para a UFF e não garante direito sobre a tecnologia. Licenças, transferências e parcerias só valem depois de contrato assinado com a UFF, conduzido pela AGIR, conforme a Lei de Inovação (Lei nº 10.973/2004).'] },
      { t: 'Propriedade intelectual', ps: ['As tecnologias apresentadas continuam protegidas pela Lei de Propriedade Industrial (Lei nº 9.279/1996) e pela Lei do Software (Lei nº 9.609/1998). Conhecer uma tecnologia pela vitrine não autoriza o seu uso comercial.'], ps2: ['Textos, imagens e o código do site pertencem à UFF. Você pode citar e compartilhar o conteúdo, desde que indique a fonte.'] },
      { t: 'Uso adequado', ps: ['Ao usar o site, você se compromete a não:'], itens: ['Enviar dados falsos ou de outra pessoa no formulário', 'Tentar acessar áreas restritas ou prejudicar o funcionamento do site', 'Copiar o conteúdo em massa de forma automatizada'] },
      { t: 'Links externos', ps: ['O site aponta para páginas do INPI, do gov.br e de outros órgãos. A UFF não responde pelo conteúdo desses sites.'] },
      { t: 'Disponibilidade', ps: ['Buscamos manter o site no ar e atualizado, mas ele pode passar por pausas para manutenção ou ficar temporariamente desatualizado.'] },
      { t: 'Privacidade', ps: ['O tratamento de dados pessoais segue a Política de privacidade da vitrine e a Lei Geral de Proteção de Dados.'] },
      { t: 'Mudanças e foro', ps: ['Estes termos podem mudar, e a data de atualização fica no topo da página. Questões sobre estes termos serão resolvidas na Justiça Federal, Seção Judiciária do Rio de Janeiro.'] }
    ]
  },
  cookies: {
    curto: 'Política de cookies', eyebrow: 'Cookies', titulo: 'Política de cookies',
    intro: 'O que são cookies, quais a Vitrine Tecnológica da UFF usa e como você pode controlá-los no seu navegador.',
    secoes: [
      { t: 'O que são cookies', ps: ['Cookies são pequenos arquivos que o site guarda no seu navegador para lembrar informações entre uma página e outra, ou entre uma visita e outra.'] },
      { t: 'Cookies que usamos', ps: ['A vitrine usa apenas cookies necessários para funcionar:'], itens: ['Segurança: protegem o formulário de interesse contra envios automáticos', 'Preferências: guardam a sua escolha sobre o aviso de cookies', 'Sessão: mantêm as páginas funcionando durante a visita'], ps2: ['A lista completa, com nome, finalidade e duração de cada cookie, será publicada aqui: [TABELA DE COOKIES DO SITE].'] },
      { t: 'Estatística e publicidade', ps: ['A vitrine não usa cookies de publicidade. Se ferramentas de estatística forem ativadas, elas aparecerão nesta página e só funcionarão depois da sua autorização no aviso de cookies.'] },
      { t: 'Cookies de terceiros', ps: ['Alguns recursos externos, como o VLibras e a barra do gov.br, podem gravar cookies próprios. Esses serviços seguem as políticas de privacidade dos seus responsáveis.'] },
      { t: 'Como controlar', ps: ['Você pode apagar ou bloquear cookies nas configurações do seu navegador. Bloquear os cookies necessários pode impedir partes do site de funcionar, como o envio do formulário.'] },
      { t: 'Base legal e mudanças', ps: ['O uso de cookies segue a Lei Geral de Proteção de Dados e as orientações da ANPD. Esta política pode mudar, e a data de atualização fica no topo da página.'] }
    ]
  },
  acessibilidade: {
    curto: 'Acessibilidade', eyebrow: 'Acessibilidade', titulo: 'Acessibilidade na Vitrine Tecnológica',
    intro: 'Queremos que qualquer pessoa consiga encontrar e entender as tecnologias da UFF, inclusive quem usa leitor de tela, teclado ou ampliação de tela.',
    secoes: [
      { t: 'Padrões que seguimos', ps: ['O site segue o Modelo de Acessibilidade em Governo Eletrônico (eMAG) e as diretrizes WCAG 2.1, nível AA, como pede a Lei Brasileira de Inclusão (Lei nº 13.146/2015).'] },
      { t: 'Recursos do site', ps: ['Para facilitar o acesso, o site oferece:'], itens: ['Navegação completa pelo teclado, com foco sempre visível', 'Contraste de cores adequado e textos em tamanho confortável', 'Imagens com texto alternativo ou marcadas como decorativas', 'Formulários com rótulos visíveis e mensagens de erro claras', 'Resumo de cada tecnologia em linguagem simples', 'Layout que se adapta a celular, tablet e computador'] },
      { t: 'Atalhos de teclado', ps: ['Os atalhos seguem o padrão do governo federal:'], itens: ['Alt + 1: ir para o conteúdo', 'Alt + 2: ir para o menu', 'Alt + 3: ir para a busca', 'Alt + 4: ir para o rodapé'], ps2: ['No Firefox, use Alt + Shift + número. No Mac, use Control + Option + número.'] },
      { t: 'Tradução para Libras', ps: ['O site oferece o VLibras, ferramenta do governo federal que traduz os textos para a Língua Brasileira de Sinais.'] },
      { t: 'Limitações conhecidas', ps: ['Alguns PDFs vêm digitalizados do INPI e podem não ser lidos por leitores de tela. Nesses casos, os dados principais aparecem em texto na própria página da tecnologia.'] },
      { t: 'Encontrou uma barreira?', ps: ['Conte o que aconteceu, em qual página e qual recurso você usava. Escreva para agir.proppi@id.uff.br e vamos corrigir o problema assim que possível.'] }
    ]
  }
};
class Component extends DCLogic {
  renderVals() {
    var key = PAGS[this.props.pagina] ? this.props.pagina : 'privacidade';
    var pg = PAGS[key];
    var largo = this.props.layout !== 'mobile';
    var bfs = largo ? '17px' : '16px';
    function txt(arr) { return (arr || []).map(function (t) { return { t: t, fs: bfs }; }); }
    var secoes = pg.secoes.map(function (s, i) {
      var id = key + '-' + (i + 1);
      return { id: id, hid: id + '-t', ancora: '#' + id, rot: (i + 1) + '. ' + s.t, h2: largo ? '24px' : '21px', ps: txt(s.ps), itens: txt(s.itens), temItens: !!(s.itens && s.itens.length), ps2: txt(s.ps2) };
    });
    return {
      pg: { curto: pg.curto, eyebrow: pg.eyebrow, titulo: pg.titulo, intro: pg.intro, atualizado: HOJE, sumId: key + '-sum' },
      secoes: secoes,
      v: largo
        ? { maxW: '1248px', pad: '24px 24px 88px', gapTopo: '28px', h1: '42px', lead: '19px', cols: '280px minmax(0, 1fr)', gapCols: '64px', sumPos: 'sticky', inicio: 'DesktopInicio.dc.html' }
        : { maxW: '100%', pad: '16px 16px 40px', gapTopo: '20px', h1: '28px', lead: '17px', cols: 'minmax(0, 1fr)', gapCols: '28px', sumPos: 'static', inicio: 'Main.dc.html' }
    };
  }
}
</script>
</body>
</html>
