<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cabeçalho desktop — Vitrine Tecnológica da UFF</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 100%; background: #ffffff; font-family: 'Nunito Sans', system-ui, sans-serif; color: #18181b; line-height: 1.5; text-wrap: pretty">
<dc-import name="GovBar" hint-size="100%,40px"></dc-import>
<header style="border-bottom: 1px solid #e4e4e7">
<div style="max-width: 1248px; margin: 0 auto; padding: 0 24px; box-sizing: border-box; height: 80px; display: flex; align-items: center; gap: 32px">
<a href="DesktopInicio.dc.html" aria-label="Vitrine Tecnológica da UFF — página inicial" style="display: flex; align-items: center; gap: 16px; flex-shrink: 0; text-decoration: none; color: #18181b">
<img src="/_blob/cf5e5267f25648bc361a2395f844d1ec" alt="" style="width: 150px; height: auto; display: block">
<span aria-hidden="true" style="width: 1px; height: 38px; background: #d4d4d8"></span>
<span style="display: flex; flex-direction: column; font-size: 17px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; color: #004f9f">Vitrine<span style="color: #18181b">Tecnológica</span></span>
</a>
<nav aria-label="Principal" style="flex-grow: 1; min-width: 0">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5"><li><a href="{{n.href}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; height: 80px; padding: 0 12px; box-sizing: border-box; font-size: 15px; font-weight: 700; color: {{n.fg}}; text-decoration: none; white-space: nowrap; box-shadow: inset 0 -3px 0 {{n.bar}}">{{n.t}}</a></li></sc-for>
</ul>
</nav>
<div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
<button type="button" onClick="{{alternar}}" aria-label="Buscar tecnologia" aria-expanded="{{buscaExp}}" style="width: 44px; height: 44px; border: 0; padding: 0; border-radius: 12px; background: {{lupaBg}}; color: {{lupaFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></button>
<a href="DesktopInteresse.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; background: #004f9f; color: #ffffff; font-size: 15px; font-weight: 800; text-decoration: none; white-space: nowrap">Falar com a AGIR</a>
</div>
</div>
</header>

<sc-if value="{{busca}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; right: 0; top: 120px; height: 780px; z-index: 60">
<button type="button" onClick="{{fechar}}" aria-label="Fechar busca" tabindex="-1" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(7,29,65,.45); cursor: pointer"></button>
<div role="dialog" aria-modal="true" aria-labelledby="busca-dlg-t" style="position: relative; background: #ffffff; border-bottom: 1px solid #e4e4e7; box-shadow: 0 24px 48px rgba(7,29,65,.18)">
<div style="max-width: 1248px; margin: 0 auto; padding: 28px 24px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: flex-end; gap: 12px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
<label id="busca-dlg-t" for="busca-dlg-in" style="font-size: 14px; font-weight: 800">Buscar tecnologia</label>
<div style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 8px 0 20px; border-radius: 16px; border: 2px solid #004f9f; background: #ffffff; box-sizing: border-box">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5f5f68" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
<input id="busca-dlg-in" type="search" value="{{q}}" onChange="{{digitar}}" autoFocus="{{true}}" autocomplete="off" placeholder="Tema, aplicação ou nº do pedido. Ex.: energia solar" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 19px; color: #18181b">
<sc-if value="{{temQ}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{limpar}}" aria-label="Limpar busca" style="width: 40px; height: 40px; border: 0; padding: 0; border-radius: 10px; background: #f2f2f4; color: #3f3f46; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></sc-if>
<a href="DesktopBusca.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; padding: 0 26px; border-radius: 12px; background: #004f9f; color: #ffffff; font-size: 16px; font-weight: 800; text-decoration: none">Buscar</a>
</div>
</div>
<button type="button" onClick="{{fechar}}" aria-label="Fechar busca" style="width: 52px; height: 52px; margin-bottom: 6px; border: 1px solid #e4e4e7; padding: 0; border-radius: 14px; background: #ffffff; color: #18181b; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>

<sc-if value="{{semQ}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #5f5f68">Buscas populares</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{populares}}" as="p" hint-placeholder-count="5"><button type="button" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #c9d6e6; background: #ffffff; font: inherit; font-size: 15px; font-weight: 700; color: #18181b; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5f5f68" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>{{p.t}}</button></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #5f5f68">Explorar por área</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><a href="DesktopCatalogo.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; font-size: 15px; font-weight: 700; color: #18181b; text-decoration: none; border-bottom: 1px solid #ececef">{{a.t}}<span style="font-size: 13px; font-weight: 700; color: #5f5f68">{{a.n}}</span></a></sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{temQ}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
<h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #5f5f68">Sugestões</h2>
<span role="status" style="font-size: 14px; color: #3f3f46">{{contagem}}</span>
</div>
<sc-if value="{{temSug}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{sugestoes}}" as="s" hint-placeholder-count="4"><a href="DesktopPatente.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 14px; border: 1px solid #e4e4e7; color: #18181b; text-decoration: none"><img src="{{s.ill}}" alt="" style="width: 80px; height: 56px; object-fit: cover; border-radius: 10px; flex-shrink: 0; display: block"><span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.3"><span style="font-size: 13px; font-weight: 700; color: #004f9f">{{s.meta}}</span><b style="font-size: 15px; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{s.titulo}}</b></span></a></sc-for>
</div>
</sc-if>
<sc-if value="{{semSug}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 18px 20px; border-radius: 14px; background: #f6f6f7; font-size: 16px; color: #3f3f46">Nenhuma tecnologia encontrada para “{{q}}”. Tente um termo mais geral, como “saúde” ou “energia”.</p></sc-if>
<a href="DesktopBusca.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 16px; font-weight: 800; color: #004f9f">Ver todos os resultados para “{{q}}”<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</sc-if>

</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ativo":{"editor":null},"$preview":{"width":1440,"height":120}}'>
var NAV = [
  { id: 'tec', t: 'Tecnologias', href: 'DesktopCatalogo.dc.html' },
  { id: 'pat', t: 'Patentes', href: 'DesktopCatalogo.dc.html' },
  { id: 'sw', t: 'Programas de computador', href: 'DesktopCatalogo.dc.html' },
  { id: 'como', t: 'Como licenciar', href: 'DesktopComoLicenciar.dc.html' },
  { id: 'agir', t: 'Sobre a AGIR', href: 'https://agir.uff.br' }
];
var B = '/_blob/';
var TECH = [
  { ill: B + '78ca5bded0a0d5f19682622304a32c5c', tipo: 'Patente', area: 'Biotecnologia', titulo: 'Corante natural em microcápsulas, feito a partir de cianobactéria', resumo: 'Pigmento estável para alimentos, cosméticos e tintas.', tags: 'corante pigmento alimentos cosmeticos tintas microencapsulacao' },
  { ill: B + 'de5e956d7b4baf4ac84f816c157c7742', tipo: 'Patente', area: 'Energia e meio ambiente', titulo: 'Barco autônomo movido a energia solar que monitora a qualidade da água', resumo: 'Mede vários parâmetros ao mesmo tempo e envia os dados em tempo real.', tags: 'energia solar agua monitoramento sensores' },
  { ill: B + '9bed532f65c2cd83b501f16b90ba4cfe', tipo: 'Patente', area: 'Petróleo e gás', titulo: 'Câmera submarina com IA que mede vazamentos de óleo e gás', resumo: 'Calcula área, bolhas e vazão em tempo real e dispara alarmes.', tags: 'petroleo gas energia vazamento inteligencia artificial ia camera monitoramento' },
  { ill: B + 'f7f7c756534455be036d9adb1a6186e2', tipo: 'Programa de computador', area: 'Eletrônica e computação', titulo: 'Balaio: mede o resto de comida no prato com processamento de imagem', resumo: 'Inteligência artificial e reconhecimento de padrões.', tags: 'software inteligencia artificial ia imagem alimentos desperdicio' },
  { ill: B + '5e32bc96102efad2cc334aae40792f32', tipo: 'Patente', area: 'Saúde e medicamentos', titulo: 'Kit de baixo custo para triagem da doença de Pompe, com coleta em casa', resumo: 'Urina coletada em papel filtro.', tags: 'saude diagnostico triagem doenca rara' },
  { ill: B + '4d5f3791c9dc59aadd2b6a5eca1e5795', tipo: 'Patente', area: 'Saúde e medicamentos', titulo: 'Formulação antiviral de uso nasal que alcança os alvéolos pulmonares', resumo: 'Inativou partículas de SARS-CoV-2 e H1N1.', tags: 'saude medicamento antiviral covid gripe' },
  { ill: B + '8a67c779195ac2f2f0245e43098c9a23', tipo: 'Patente', area: 'Energia e meio ambiente', titulo: 'Novo uso do PTFE como material ativo em baterias alcalinas', resumo: 'O polímero participa das reações do eletrodo positivo.', tags: 'energia bateria eletroquimica materiais' },
  { ill: B + 'fcb7b58e417b1ed80532c0988ea3a741', tipo: 'Patente', area: 'Petróleo e gás', titulo: 'Método que avalia a matéria orgânica de rochas marinhas para exploração de petróleo', resumo: 'Simulações em nível de poço.', tags: 'petroleo exploracao geologia energia' },
  { ill: B + '71e3d736f2f5121f0b393306c5fda41f', tipo: 'Patente', area: 'Alimentos e agronegócio', titulo: 'Petisco crocante de kefir, produzido por liofilização', resumo: 'Leite fermentado com kefir em formato de snack.', tags: 'alimentos laticinios snack fermentado' }
];
var POP = ['energia', 'saúde', 'inteligência artificial', 'petróleo', 'alimentos'];
var AREAS = [
  { t: 'Saúde e medicamentos', n: '40' }, { t: 'Química e materiais', n: '14' }, { t: 'Alimentos e agronegócio', n: '12' }, { t: 'Energia e meio ambiente', n: '10' }, { t: 'Petróleo e gás', n: '8' }, { t: 'Programas de computador', n: '203' }
];
function norm(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function buscar(q) {
  var n = norm(q).trim(); if (!n) return [];
  var ws = n.split(/\s+/);
  return TECH.filter(function (t) { var h = norm(t.titulo + ' ' + t.resumo + ' ' + t.area + ' ' + t.tipo + ' ' + t.tags); return ws.every(function (w) { return h.indexOf(w) > -1; }); });
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { busca: false, q: '' }; }
  renderVals() {
    var self = this, st = this.state, a = this.props.ativo || '';
    var res = buscar(st.q), temQ = st.q.trim().length > 0;
    return {
      nav: NAV.map(function (n) { var on = n.id === a; return { t: n.t, href: n.href, cur: on ? 'page' : 'false', fg: on ? '#004f9f' : '#18181b', bar: on ? '#004f9f' : 'transparent' }; }),
      busca: st.busca, buscaExp: String(st.busca),
      lupaBg: st.busca ? '#004f9f' : '#f2f6fb', lupaFg: st.busca ? '#ffffff' : '#004f9f',
      alternar: function () { self.setState({ busca: !st.busca }); },
      fechar: function () { self.setState({ busca: false }); },
      q: st.q, temQ: temQ, semQ: !temQ,
      digitar: function (e) { self.setState({ q: e.target.value }); },
      limpar: function () { self.setState({ q: '' }); },
      populares: POP.map(function (p) { return { t: p, pick: function () { self.setState({ q: p }); } }; }),
      areas: AREAS,
      sugestoes: res.slice(0, 4).map(function (t) { return { ill: t.ill, titulo: t.titulo, meta: t.tipo + ' · ' + t.area }; }),
      temSug: res.length > 0, semSug: temQ && res.length === 0,
      contagem: res.length === 1 ? '1 tecnologia encontrada' : res.length + ' tecnologias encontradas'
    };
  }
}
</script>
</body>
</html>
